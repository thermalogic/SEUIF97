name: Build and Release Shared Libraries

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build triggered'
        type: string
      release_version:
        description: 'Release version (e.g., v1.2.0)'
        required: true
        type: string

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc make cmake

    - name: Clean build
      run: rm -rf bin build-cmake

    - name: Build with CMake
      run: |
        mkdir -p build-cmake && cd build-cmake
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Verify build
      run: |
        ls -la build-cmake/bin/
        file build-cmake/bin/libseuif97.so

    - name: Copy artifacts
      run: |
        mkdir -p bin
        cp build-cmake/bin/libseuif97.so bin/libseuif97-linux-x64.so

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-shared-lib
        path: bin/libseuif97-linux-x64.so

  build-windows-mingw:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Setup MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Clean build
      run: Remove-Item -Recurse -Force bin, build-cmake -ErrorAction SilentlyContinue

    - name: Build with MinGW
      run: |
        mkdir build-cmake; cd build-cmake
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        mingw32-make -j

    - name: Verify build
      run: dir build-cmake/bin

    - name: Copy artifacts
      run: |
        mkdir bin -Force
        copy build-cmake/bin/libseuif97.dll bin/libseuif97-windows-mingw-x64.dll

    - name: Upload MinGW artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-shared-lib-mingw
        path: bin/libseuif97-windows-mingw-x64.dll

  build-windows-msvc:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Clean build
      run: Remove-Item -Recurse -Force bin, build-cmake -ErrorAction SilentlyContinue

    - name: Build with MSVC
      run: |
        mkdir build-cmake; cd build-cmake
        cmake .. -G "Visual Studio 17 2022" -A x64
        cmake --build . --config Release

    - name: Verify build
      run: dir build-cmake/Release

    - name: Copy artifacts
      run: |
        mkdir bin -Force
        copy build-cmake/Release/seuif97.dll bin/seuif97-windows-msvc-x64.dll

    - name: Upload MSVC artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-shared-lib-msvc
        path: bin/seuif97-windows-msvc-x64.dll

  release:
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows-mingw, build-windows-msvc]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-shared-lib
        path: bin/

    - name: Download MinGW artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-shared-lib-mingw
        path: bin/

    - name: Download MSVC artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-shared-lib-msvc
        path: bin/

    - name: List artifacts
      run: ls -la bin/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_version }}
        name: ${{ github.event.inputs.release_version }}
        body: |
          Automated release of SEUIF97 shared libraries.
          
          **Build Information:**
          - Linux (Ubuntu 22.04, GCC)
          - Windows (MinGW-w64, x64)
          - Windows (MSVC 2022, x64)
          
          **Files Included:**
          - libseuif97-linux-x64.so - Linux 64-bit shared library
          - libseuif97-windows-mingw-x64.dll - Windows 64-bit (MinGW)
          - seuif97-windows-msvc-x64.dll - Windows 64-bit (MSVC)
        files: |
          bin/libseuif97-linux-x64.so
          bin/libseuif97-windows-mingw-x64.dll
          bin/seuif97-windows-msvc-x64.dll
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
